<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Security Repositories</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h1>Top Security Repositories</h1>
        <button id="dark-mode-toggle">Toggle Dark Mode</button>
    </div>
    <div id="filter-container">
        <input type="text" id="topic-input" placeholder="Enter security topic...">
        <button id="filter-button">Filter</button>
    </div>
    <div id="repo-list">
        <!-- Repository information will be displayed here -->
    </div>
    <script>
        function fetchAndDisplayRepos(topic = '') {
            let apiUrl = 'https://api.github.com/search/repositories?q=topic:security';
            if (topic && topic.trim() !== '') {
                apiUrl += `+topic:${encodeURIComponent(topic.trim())}`;
            }
            apiUrl += '&sort=stars&order=desc';

            const repoListDiv = document.getElementById('repo-list');
            repoListDiv.innerHTML = 'Loading...'; // Clear previous results and show loading message

            fetch(apiUrl)
                .then(response => response.json())
                .then(data => {
                    repoListDiv.innerHTML = ''; // Clear loading message
                    if (data.items && data.items.length > 0) {
                        const ul = document.createElement('ul');
                        data.items.forEach(repo => {
                            const li = document.createElement('li');
                            
                            const repoLink = document.createElement('a');
                            repoLink.href = repo.html_url;
                            repoLink.textContent = repo.name;
                            repoLink.target = '_blank'; // Open in new tab
                            
                            const description = document.createElement('p');
                            description.textContent = repo.description;
                            
                            const stars = document.createElement('span');
                            stars.textContent = `Stars: ${repo.stargazers_count} | `;
                            
                            const forks = document.createElement('span');
                            forks.textContent = `Forks: ${repo.forks_count}`;
                            
                            li.appendChild(repoLink);
                            li.appendChild(description);
                            li.appendChild(stars);
                            li.appendChild(forks);
                            
                            ul.appendChild(li);
                        });
                        repoListDiv.appendChild(ul);
                    } else {
                        repoListDiv.textContent = 'No repositories found for the specified topic.';
                    }
                })
                .catch(error => {
                    console.error('Error fetching data:', error);
                    repoListDiv.innerHTML = ''; // Clear loading message
                    repoListDiv.textContent = 'Failed to load repositories.';
                });
        }

        document.getElementById('filter-button').addEventListener('click', () => {
            const topic = document.getElementById('topic-input').value;
            fetchAndDisplayRepos(topic);
        });

        // Initial load
        fetchAndDisplayRepos();

        // Dark Mode Toggle Logic
        const darkModeButton = document.getElementById('dark-mode-toggle');
        const body = document.body;

        function applyTheme(theme) {
            if (theme === 'dark') {
                body.classList.add('dark-mode');
                darkModeButton.textContent = 'Toggle Light Mode';
            } else {
                body.classList.remove('dark-mode');
                darkModeButton.textContent = 'Toggle Dark Mode';
            }
        }

        // On load, check localStorage and apply theme
        const currentTheme = localStorage.getItem('theme');
        if (currentTheme) {
            applyTheme(currentTheme);
        } else {
            applyTheme('light'); // Default to light mode
        }

        darkModeButton.addEventListener('click', () => {
            if (body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'light');
                applyTheme('light');
            } else {
                localStorage.setItem('theme', 'dark');
                applyTheme('dark');
            }
        });
    </script>
</body>
</html>
